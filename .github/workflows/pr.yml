name: PR
on:
  pull_request:
  push: { branches: [main] }
concurrency: { group: "pr-${{ github.ref }}", cancel-in-progress: true }
jobs:
  gate:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # Pin deliberately; bump when the maintainer upgrades. Verify this path exists
        # on the actual macos-26 runner image before relying on this workflow — it was
        # written to match the maintainer's local Xcode 27.0 but GitHub's hosted image
        # may lag or differ. `ls /Applications | grep Xcode` on the runner if this fails.
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install tools
        run: brew install swiftlint
      - name: Placeholder secrets (fork-safe)
        run: cp NewTubeApp/Config/Secrets.xcconfig.example NewTubeApp/Config/Secrets.xcconfig
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            NewTubeCore/.build
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
      - name: Docs sanity
        run: |
          test $(wc -l < AGENTS.md) -le 200
          head -1 CLAUDE.md | grep -q '^@AGENTS.md$'
          scripts/check-doc-links.sh          # WS2-T2.1 adds; until then `true`
      - name: Secrets and format
        run: |
          scripts/check-no-secrets.sh
          xcrun swift-format lint --strict --recursive --configuration .swift-format NewTubeCore "NewTubeApp/NewTube" NewTubeApp/NewTubeTests NewTubeApp/UITests
      - name: Lint
        run: swiftlint lint --strict --baseline .swiftlint.baseline --config .swiftlint.yml
      - name: Unit tests
        run: |
          (cd NewTubeCore && xcodebuild test -scheme NewTubeCore -destination "platform=tvOS Simulator,name=Apple TV 4K (4th generation)" CODE_SIGNING_ALLOWED=NO)
          xcodebuild test -workspace NewTube.xcworkspace -scheme "NewTube" -destination "platform=tvOS Simulator,name=Apple TV 4K (4th generation)" -only-testing:NewTubeTests CODE_SIGNING_ALLOWED=NO
      - name: Build tvOS
        run: xcodebuild build -workspace NewTube.xcworkspace -scheme "NewTube" -destination "platform=tvOS Simulator,name=Apple TV 4K (4th generation)" CODE_SIGNING_ALLOWED=NO -quiet
